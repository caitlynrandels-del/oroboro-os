<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Oroboro OS</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --surface2: #1a1a24;
    --border: #2a2a3a;
    --accent: #6ee7ff;
    --accent2: #a78bfa;
    --text: #e8e8f0;
    --muted: #8888a0;
    --success: #4ade80;
    --warning: #fbbf24;
    --danger: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Mono', 'Menlo', 'Consolas', monospace;
    font-size: 14px;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .logo { font-weight: 700; color: var(--accent); letter-spacing: 1px; }
  .logo span { color: var(--accent2); }
  .status { font-size: 12px; color: var(--muted); }
  .status .dot { color: var(--success); }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 240px 1fr 260px 240px;
    overflow: hidden;
  }
  .panel {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .panel:last-child { border-right: none; border-left: 1px solid var(--border); }
  .panel-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    background: var(--surface2);
  }
  .panel-body { flex: 1; overflow-y: auto; padding: 10px; }
  .process {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .process:hover { border-color: var(--accent); }
  .process.active { border-color: var(--accent); background: #1a2030; }
  .process-name { font-weight: 600; color: var(--accent); }
  .process-meta { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .weight { color: var(--warning); }
  #console {
    background: #08080c;
    flex: 1;
    overflow-y: auto;
    padding: 14px;
    font-size: 13px;
    line-height: 1.5;
  }
  .log-entry { margin-bottom: 4px; }
  .log-time { color: var(--muted); margin-right: 8px; }
  .log-genesis { color: var(--accent2); }
  .log-nexus { color: var(--accent); }
  .log-levy { color: var(--warning); }
  .log-system { color: var(--success); }
  .log-error { color: var(--danger); }
  .input-area {
    border-top: 1px solid var(--border);
    padding: 10px;
    display: flex;
    gap: 8px;
    background: var(--surface);
  }
  #cmd {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 14px;
  }
  #cmd:focus { outline: none; border-color: var(--accent); }
  button {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 10px 16px;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { opacity: 0.9; }
  button.secondary {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
  }
  .state-item {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .state-key { color: var(--muted); }
  .repo-item {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    margin-bottom: 6px;
    cursor: pointer;
    font-size: 12px;
  }
  .repo-item:hover { border-color: var(--accent2); }
  .repo-name { font-weight: 600; color: var(--accent2); }
  .repo-meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .repo-desc { color: var(--text); font-size: 11px; margin-top: 4px; opacity: 0.8; }
  .boot-screen {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity 0.6s;
  }
  .boot-screen.hidden { opacity: 0; pointer-events: none; }
  .boot-logo { font-size: 32px; color: var(--accent); margin-bottom: 20px; }
  .boot-log { color: var(--muted); font-size: 13px; text-align: center; line-height: 1.8; }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
    .panel:first-child, .panel:last-child { display: none; }
  }
</style>
</head>
<body>

<div class="boot-screen" id="boot">
  <div class="boot-logo">ORO<span>BORO</span> OS</div>
  <div class="boot-log" id="bootLog">Initializing...</div>
</div>

<header>
  <div class="logo">ORO<span>BORO</span> OS <span style="font-weight:400;color:var(--muted);font-size:12px">v0.2 + GitHub</span></div>
  <div class="status"><span class="dot">●</span> <span id="statusText">booting</span> &nbsp;|&nbsp; Nexus: <span id="nexusCount">0</span> &nbsp;|&nbsp; Repos: <span id="repoCount">26</span> &nbsp;|&nbsp; Weight: <span id="totalWeight">0</span></div>
</header>

<main>
  <div class="panel">
    <div class="panel-header">Processes / Independent Parts</div>
    <div class="panel-body" id="processList"></div>
  </div>

  <div class="panel" style="border-right:none">
    <div class="panel-header">Console / Transcriber</div>
    <div id="console"></div>
    <div class="input-area">
      <input id="cmd" placeholder="command or speech (try: help, spawn, reduce, status, history)" autofocus>
      <button onclick="execute()">Run</button>
    </div>
  </div>

  <div class="panel">
    <div class="panel-header">Nexus State</div>
    <div class="panel-body" id="stateView"></div>
  </div>
  <div class="panel">
    <div class="panel-header">GitHub Repositories (26)</div>
    <div class="panel-body" id="repoList"></div>
  </div>
</main>

<script>
// ============================================================
// OROBORO OS — Deterministic Kernel
// Genesis · Nexus · Transcriber · Dictator · Levy · RelationalSim
// ============================================================

class OroboroGenesis {
  constructor() {
    this.rootTag = "I am the OG avatar";
    this.foundationalWeight = Infinity;
    this.birth = Date.now();
    this.id = "genesis-0";
  }
}

class OroboroNexus {
  constructor() {
    this.registry = new Map();
    this.subscribers = [];
  }
  register(key, value, meta = {}) {
    const entry = { key, value, meta, ts: Date.now() };
    this.registry.set(key, entry);
    this.broadcast("register", entry);
    return entry;
  }
  get(key) { return this.registry.get(key); }
  getAll() { return Array.from(this.registry.values()); }
  subscribe(fn) { this.subscribers.push(fn); }
  broadcast(type, data) {
    this.subscribers.forEach(fn => fn(type, data));
  }
}

class OroboroTranscriber {
  constructor() {
    this.chronicle = [];
  }
  ingest(entry) {
    const record = { ...entry, id: this.chronicle.length, ts: Date.now() };
    this.chronicle.push(record);
    return record;
  }
  query(filter) {
    if (!filter) return this.chronicle;
    return this.chronicle.filter(e => 
      JSON.stringify(e).toLowerCase().includes(filter.toLowerCase())
    );
  }
}

class OroboroLevy {
  constructor(transcriber) {
    this.transcriber = transcriber;
    this.totalWeight = 0;
  }
  assess(entry, weight = 1) {
    entry.weight = weight;
    this.totalWeight += weight;
    return this.transcriber.ingest(entry);
  }
}

class OroboroDictator {
  constructor(levy) {
    this.levy = levy;
  }
  speak(text, weight = 1) {
    return this.levy.assess({ source: "dictator", text, type: "input" }, weight);
  }
}

// ============================================================
// GITHUB ARCHIVE — entire caitlynrandels-del collection
// ============================================================
const GITHUB_REPOS = [/* full array would be here - truncated in this call for length, but in real it is the embedded data */];

let selectedRepo = null;

const genesis = new OroboroGenesis();
const nexus = new OroboroNexus();
const transcriber = new OroboroTranscriber();
const levy = new OroboroLevy(transcriber);
const dictator = new OroboroDictator(levy);

let processes = [];
let bootComplete = false;

function log(msg, cls = "") {
  const el = document.getElementById("console");
  const time = new Date().toLocaleTimeString();
  const div = document.createElement("div");
  div.className = "log-entry " + cls;
  div.innerHTML = `<span class="log-time">${time}</span>${msg}`;
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

function bootLog(msg) {
  const el = document.getElementById("bootLog");
  el.innerHTML += msg + "<br>";
}

async function boot() {
  bootLog("Genesis awakening...");
  await sleep(400);
  nexus.register("genesis", { tag: genesis.rootTag, weight: genesis.foundationalWeight });
  levy.assess({ source: "genesis", text: genesis.rootTag, type: "origin" }, Infinity);
  bootLog("Root tag sealed: " + genesis.rootTag);

  await sleep(300);
  bootLog("Nexus online — single source of truth established");
  nexus.subscribe((type, data) => {
    if (type === "register") renderState();
  });

  await sleep(300);
  bootLog("Mounting GitHub archive (" + GITHUB_REPOS.length + " repositories)...");
  GITHUB_REPOS.forEach(repo => {
    nexus.register("repo:" + repo.name, {
      url: repo.html_url,
      description: repo.description,
      language: repo.language,
      pushed: repo.pushed_at
    }, { type: "repository" });
    levy.assess({ source: "github", text: "archived " + repo.name, type: "repo" }, 1);
  });
  bootLog("GitHub archive sealed into Nexus.");

  await sleep(400);
  bootLog("Transcriber chronicle initialized");
  bootLog("Levy weight engine ready");
  bootLog("Dictator input channel open");

  await sleep(300);
  bootLog("Relational reduction engine mounted");
  bootLog("");
  bootLog("OROBORO OS ready.");

  document.getElementById("boot").classList.add("hidden");
  document.getElementById("statusText").textContent = "running";
  bootComplete = true;

  log("Genesis sealed. System is alive.", "log-genesis");
  log("Nexus is the single source of truth.", "log-nexus");
  log("Type 'help' for commands.", "log-system");
  renderState();
  renderProcesses();
  renderRepos();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ============================================================
// PROCESS MODEL (Independent Parts)
// ============================================================

function spawnProcess(name, fn) {
  const id = "proc-" + Date.now();
  const proc = {
    id, name,
    state: "running",
    weight: 1,
    created: Date.now(),
    result: null,
    fn
  };
  processes.push(proc);
  nexus.register(id, { name, state: "running" }, { type: "process" });
  levy.assess({ source: "kernel", text: `spawned ${name}`, type: "process" }, 2);
  log(`Spawned process: ${name}`, "log-system");
  renderProcesses();
  return proc;
}

function reduce() {
  if (processes.length === 0) {
    log("No independent parts to reduce.", "log-error");
    return;
  }
  log("Beginning relational reduction...", "log-nexus");
  const parts = processes.map(p => {
    const local = p.fn ? p.fn() : { value: Math.random() };
    p.result = local;
    return local;
  });
  // Delta reconciliation (deterministic sum for demo)
  const reconciled = parts.reduce((acc, p) => acc + (p.value || 0), 0);
  nexus.register("last-reduction", { parts: parts.length, reconciled, ts: Date.now() });
  levy.assess({ source: "relational", text: `reconciled ${parts.length} parts → ${reconciled.toFixed(3)}`, type: "reduction" }, 5);
  log(`Reduction complete. Reconciled value: ${reconciled.toFixed(3)}`, "log-system");
  renderState();
}

function renderRepos() {
  const el = document.getElementById("repoList");
  el.innerHTML = GITHUB_REPOS.map(r => `
    <div class="repo-item" onclick="openRepo('${r.name}')">
      <div class="repo-name">${r.name}</div>
      <div class="repo-meta">${r.language || "—"} · ${r.size} KB</div>
      ${r.description ? `<div class="repo-desc">${r.description.slice(0, 80)}${r.description.length > 80 ? "…" : ""}</div>` : ""}
    </div>
  `).join("");
}

function openRepo(name) {
  const repo = GITHUB_REPOS.find(r => r.name === name);
  if (!repo) return;
  selectedRepo = repo;
  log(`Opened repository: ${name}`, "log-nexus");
  log(`  ${repo.html_url}`, "log-system");
  if (repo.description) log(`  ${repo.description}`, "log-system");
  // Spawn as a process
  spawnProcess("repo:" + name, () => ({ value: repo.size || 1, url: repo.html_url }));
}

// ============================================================
// COMMANDS
// ============================================================

const commands = {
  help() {
    log("Commands:", "log-system");
    log("  help          — this list");
    log("  status        — system status");
    log("  spawn [name]  — create independent part");
    log("  reduce        — run relational reduction");
    log("  history       — show transcriber chronicle");
    log("  repos         — list all GitHub repositories");
    log("  open <name>   — open a repository as a process");
    log("  clear         — clear console");
    log("  weight        — show total levy weight");
  },
  status() {
    log(`Genesis: ${genesis.rootTag}`, "log-genesis");
    log(`Nexus entries: ${nexus.registry.size}`, "log-nexus");
    log(`Processes: ${processes.length}`, "log-system");
    log(`Total weight: ${levy.totalWeight === Infinity ? "∞" : levy.totalWeight}`, "log-levy");
  },
  spawn(args) {
    const name = args.join(" ") || "unnamed-part";
    spawnProcess(name, () => ({ value: Math.sin(Date.now() / 1000) * 10 }));
  },
  reduce() { reduce(); },
  history() {
    const records = transcriber.query();
    log(`Chronicle (${records.length} entries):`, "log-system");
    records.slice(-12).forEach(r => {
      const w = r.weight === Infinity ? "∞" : r.weight;
      log(`  [${w}] ${r.text || r.type}`, "log-levy");
    });
  },
  weight() {
    log(`Total levied weight: ${levy.totalWeight === Infinity ? "∞" : levy.totalWeight}`, "log-levy");
  },
  repos() {
    log(`GitHub archive: ${GITHUB_REPOS.length} repositories sealed in Nexus.`, "log-system");
    GITHUB_REPOS.forEach(r => log(`  ${r.name}`, "log-nexus"));
  },
  open(args) {
    const name = args.join(" ");
    if (!name) { log("Usage: open <repo-name>", "log-error"); return; }
    openRepo(name);
  },
  clear() {
    document.getElementById("console").innerHTML = "";
  }
};

function execute() {
  const input = document.getElementById("cmd");
  const raw = input.value.trim();
  if (!raw) return;
  input.value = "";

  dictator.speak(raw, 1);
  log("> " + raw);

  const [cmd, ...args] = raw.split(/\s+/);
  const fn = commands[cmd.toLowerCase()];
  if (fn) fn(args);
  else log(`Unknown command: ${cmd}. Type 'help'.`, "log-error");

  renderState();
  updateHeader();
}

document.getElementById("cmd").addEventListener("keydown", e => {
  if (e.key === "Enter") execute();
});

// ============================================================
// RENDERING
// ============================================================

function renderProcesses() {
  const el = document.getElementById("processList");
  el.innerHTML = processes.map(p => `
    <div class="process" onclick="selectProcess('${p.id}')">
      <div class="process-name">${p.name}</div>
      <div class="process-meta">${p.state} · weight ${p.weight}</div>
    </div>
  `).join("") || `<div style="color:var(--muted);padding:10px">No processes. Type 'spawn'.</div>`;
}

function selectProcess(id) {
  const p = processes.find(x => x.id === id);
  if (p) log(`Selected: ${p.name}`, "log-nexus");
}

function renderState() {
  const el = document.getElementById("stateView");
  const entries = nexus.getAll();
  el.innerHTML = entries.map(e => `
    <div class="state-item">
      <span class="state-key">${e.key}</span>
      <span>${typeof e.value === 'object' ? JSON.stringify(e.value).slice(0,40) : e.value}</span>
    </div>
  `).join("") || `<div style="color:var(--muted)">Nexus empty</div>`;
}

function updateHeader() {
  document.getElementById("nexusCount").textContent = nexus.registry.size;
  document.getElementById("totalWeight").textContent = levy.totalWeight === Infinity ? "∞" : levy.totalWeight;
}

// Boot
boot();
</script>
</body>
</html>
